# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
version: "3.9"
name: seb-java

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: seb
      POSTGRES_USER: seb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seb -d seb"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  app:
    build:
      context: ../backend/SebPortal
      dockerfile: Dockerfile
    expose:
      - "8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/seb
      - SPRING_DATASOURCE_USERNAME=seb
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-dev-only-change-me-dev-only-change-me-32}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
