<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Granskningslogg')">
    <title>Granskningslogg</title>
</head>
<body>
<div th:replace="layout :: navbar"></div>

<div class="container-fluid" style="margin-top: 70px; padding: 20px;">

    <div class="row">
        <div class="col-sm-12">
            <h2>Granskningslogg</h2>
            <p class="text-muted">Visar de senaste 200 händelserna i systemet.</p>
        </div>
    </div>

    <div class="row" th:if="${errorMessage != null}">
        <div class="col-sm-12">
            <div class="alert alert-danger" th:text="${errorMessage}">Fel</div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="panel panel-default">
                <div class="panel-heading"><h4 class="panel-title">Loggposter</h4></div>
                <div class="panel-body">
                    <p th:if="${entries == null or #lists.isEmpty(entries)}" class="text-muted">
                        Inga loggposter hittades.
                    </p>
                    <table class="table table-striped table-bordered table-hover"
                           th:if="${entries != null and !#lists.isEmpty(entries)}">
                        <thead>
                        <tr>
                            <th>Tidpunkt</th>
                            <th>Användare</th>
                            <th>Action</th>
                            <th>Entitet</th>
                            <th>Beskrivning</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${entries}">
                            <td th:text="${e.created_at}">2026-01-01 00:00:00</td>
                            <td th:text="${e.user_name}">Användare</td>
                            <td><span class="label label-default" th:text="${e.action}">ACTION</span></td>
                            <td th:text="${e.entity_type} + ' #' + ${e.entity_id}">entity #0</td>
                            <td th:text="${e.description}">Beskrivning</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
