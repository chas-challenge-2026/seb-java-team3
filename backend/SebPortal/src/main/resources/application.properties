spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/seb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8084
spring.thymeleaf.cache=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.signing-key=${JWT_SIGNING_KEY:}
app.jwt.issuer=${JWT_ISSUER:seb-portal}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.payments.approval-threshold=50000
app.payments.double-approval-threshold=500000
# Notifieringar (BUG-007): dummy SMTP, anrop sväljs ändå tyst
spring.mail.host=localhost
spring.mail.port=25
# BUG-012: ingen multipart-gräns enforcas
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
