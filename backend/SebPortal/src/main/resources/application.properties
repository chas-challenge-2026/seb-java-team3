spring.datasource.url=jdbc:postgresql://db:5432/seb
spring.datasource.username=seb
spring.datasource.password=seb123
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8084

payment.approval.no-attestant-threshold=5000
# Reserverad för breddning (dubbel attest / attestant 2 - VD), se docs/mvp.md och ADR 0003.
# Används INTE ännu: betalningar >= 10000 får fortfarande bara ETT atteststeg (se PaymentService).
payment.approval.two-attestant-threshold=10000

# Fail startup instead of silently falling back to the Java MOD97 validator
# if the native IBAN library isn't loaded. Set to true in production.
iban.native-required=false
# JWT — grund för #115 (Rollbehörighet) och #116 (Atteststeg). Access-token gäller 15 minuter och
# förnyas tyst av frontend med refresh-token (HttpOnly-cookie, 7 dagars glidande session), se ADR 0012.
# jwt.secret sätts MED FLIT inte här: repot är publikt, och en hemlighet som står här kan vem som
# helst använda för att förfalska token. Utan värde slumpar JwtService en signeringsnyckel vid
# varje start (bara i minnet, alla loggas ut vid omstart), se ADR 0011. Vill man ha en fast nyckel,
# sätt miljövariabeln JWT_SECRET (minst 32 byte). Skriv aldrig in den här.
# 15 minuter. Frontend måste använda refresh-token (ADR 0012): utan den loggas användaren ut var 15:e minut.
jwt.expiration-ms=900000

# Refresh-token (ADR 0012). Livslängd i dagar; glidande, så varje förnyelse ger nya dagar.
app.refresh.expiration-days=7
# Cookien skickas bara över HTTPS. Stage och prod är HTTPS och webbläsare tillåter den på localhost.
# Sätt false bara om du kör mot en vanlig http-adress som inte är localhost (till exempel Safari lokalt).
app.refresh.cookie-secure=true

# Authentication/authorization uses our own JWT flow (see JwtAuthenticationFilter), not
# Spring Security's own UserDetailsService — disable the auto-generated dev login it would
# otherwise create (and log a random password for) on every startup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
