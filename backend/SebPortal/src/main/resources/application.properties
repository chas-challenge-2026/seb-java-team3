spring.datasource.url=jdbc:postgresql://db:5432/seb
spring.datasource.username=seb
spring.datasource.password=seb123
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8084

spring.thymeleaf.cache=false
# Notifieringar (BUG-007): dummy SMTP, anrop sväljs ändå tyst
spring.mail.host=localhost
spring.mail.port=25
# BUG-012: ingen multipart-gräns enforcas
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

payment.approval.no-attestant-threshold=5000
# Reserverad för breddning (dubbel attest / attestant 2 - VD), se docs/mvp.md och ADR 0003.
# Används INTE ännu: betalningar >= 10000 får fortfarande bara ETT atteststeg (se PaymentService).
payment.approval.two-attestant-threshold=10000

# JWT — grund för #115 (Rollbehörighet) och #116 (Atteststeg): kort livslängd,
# ingen refresh-token-rotation ännu (separat, icke-MVP backlogpunkt).
# Dev-hemlighet nedan. I produktion: override via env var JWT_SECRET,
# samma mönster som session-cookie-flaggorna ovan.
jwt.secret=dev-only-not-for-production-3f8a1c9e6b2d4f7a0c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a
jwt.expiration-ms=3600000

# Authentication/authorization uses our own JWT/session flow (see JwtAuthenticationFilter,
# SessionAuthenticationFilter), not Spring Security's own UserDetailsService — disable the
# auto-generated dev login it would otherwise create (and log a random password for) on
# every startup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
