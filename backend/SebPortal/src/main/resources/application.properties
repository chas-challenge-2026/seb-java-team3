spring.datasource.url=jdbc:postgresql://db:5432/seb
spring.datasource.username=seb
spring.datasource.password=seb123
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8084

# ADR-0008: HttpOnly is already Spring's default, set explicitly to document intent.
# Secure defaults to false so local (HTTP) docker-compose still works; override with
# env var SERVER_SERVLET_SESSION_COOKIE_SECURE=true wherever the app is served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

spring.thymeleaf.cache=false
# Notifieringar (BUG-007): dummy SMTP, anrop sväljs ändå tyst
spring.mail.host=localhost
spring.mail.port=25
# BUG-012: ingen multipart-gräns enforcas
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

payment.approval.no-attestant-threshold=5000
payment.approval.two-attestant-threshold=10000

# JWT — grund för #115 (Rollbehörighet) och #116 (Atteststeg): kort livslängd,
# ingen refresh-token-rotation ännu (separat, icke-MVP backlogpunkt).
# Dev-hemlighet nedan. I produktion: override via env var JWT_SECRET,
# samma mönster som session-cookie-flaggorna ovan.
jwt.secret=dev-only-not-for-production-3f8a1c9e6b2d4f7a0c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a
jwt.expiration-ms=3600000
