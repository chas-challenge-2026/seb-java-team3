<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Ny betalning')">
    <title>Ny betalning</title>
</head>
<body>
<div th:replace="layout :: navbar"></div>

<div class="container-fluid" style="margin-top: 70px; padding: 20px;">

    <div class="row">
        <div class="col-sm-8 col-sm-offset-2">
            <h2>Ny betalning</h2>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Fel meddelande
            </div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
                Bekräftelse
            </div>

            <div class="panel panel-default">
                <div class="panel-body">
                    <form method="post" action="/payments/new">
                        <div class="form-group">
                            <label for="fromAccountId">Från konto</label>
                            <select class="form-control" id="fromAccountId" name="fromAccountId" required>
                                <option th:each="acc : ${accounts}"
                                        th:value="${acc.id}"
                                        th:text="${acc.account_name} + ' — ' + ${acc.iban} + ' (' + ${acc.balance} + ' ' + ${acc.currency} + ')'">
                                    Konto
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="toIban">Mottagar-IBAN</label>
                            <input type="text" class="form-control" id="toIban" name="toIban"
                                   th:value="${toIban}" placeholder="SE45 5000 0000 0583 9825 7466" required/>
                        </div>
                        <div class="form-group">
                            <label for="amount">Belopp (SEK)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount"
                                   th:value="${amount}" placeholder="1000.00" required/>
                        </div>
                        <div class="form-group">
                            <label for="reference">Referens</label>
                            <input type="text" class="form-control" id="reference" name="reference"
                                   th:value="${reference}" placeholder="Faktura #1234"/>
                        </div>
                        <button type="submit" class="btn" style="background:#60b22c;color:#fff;font-weight:bold;">
                            Skicka betalning
                        </button>
                        <a href="/dashboard" class="btn btn-default">Avbryt</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
