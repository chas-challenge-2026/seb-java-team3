<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Logga in')">
    <title>Logga in – SEB Företagsbetalningar</title>
    <style>
        body { background: #f4f6f9; }
        .login-card { margin-top: 80px; }
        .panel-heading { background: #60b22c !important; color: #fff !important; border: none; }
        .brand-title { font-size: 1.2em; }
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4 login-card">
            <div class="panel panel-default">
                <div class="panel-heading text-center">
                    <h3 class="panel-title brand-title">
                        <strong>SEB</strong> Företagsbetalningar
                    </h3>
                </div>
                <div class="panel-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        Fel meddelande
                    </div>
                    <form method="post" action="/login">
                        <div class="form-group">
                            <label for="email">E-post</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="din@foretag.se" required autofocus/>
                        </div>
                        <div class="form-group">
                            <label for="password">Lösenord</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Lösenord" required/>
                        </div>
                        <button type="submit" class="btn btn-block"
                                style="background:#60b22c;color:#fff;font-weight:bold;">
                            Logga in
                        </button>
                    </form>
                    <hr/>
                    <p class="text-muted text-center small">Testkonton (lösenord: <code>password123</code>):</p>
                    <table class="table table-condensed small">
                        <thead>
                        <tr>
                            <th>Roll</th>
                            <th>E-post</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Initiator</td>
                            <td>lisa@malmobygg.se</td>
                        </tr>
                        <tr>
                            <td>Attestant</td>
                            <td>johan@malmobygg.se</td>
                        </tr>
                        <tr>
                            <td>Admin</td>
                            <td>sara@malmobygg.se</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
